<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142b30"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>FabFab Lyrics Trainer</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#e9f3f0;background:#0e1b20}*{box-sizing:border-box}body{margin:0}header{background:#142b30;padding:15px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:2;border-bottom:1px solid #315157}main{max-width:700px;margin:auto;padding:16px 16px 110px}h1{font-size:20px;margin:0}h2{font-size:21px}h3{font-size:17px}p{line-height:1.5}.muted,small{color:#a6bdba}.card{background:#1a3036;border:1px solid #355057;border-radius:15px;padding:16px;margin:12px 0}.line{padding:12px 9px;border-bottom:1px solid #365157;line-height:1.6;cursor:pointer}.translation{color:#a9ddd0;font-size:14px;margin-top:6px}.section{margin:22px 0 8px;color:#8bd6c2;font-weight:700}button{border:0;border-radius:11px;padding:12px 16px;font:inherit;font-weight:650;background:#70d6b5;color:#09241d;cursor:pointer}button.secondary{background:#29464e;color:#ecf7f4}button.ghost{background:transparent;color:#a8e9d4;border:1px solid #4b7974}button:disabled{opacity:.4}input,textarea,select{font:inherit;width:100%;border:1px solid #4d7278;border-radius:10px;background:#10262b;color:#fff;padding:12px;margin:6px 0 12px}textarea{min-height:160px;resize:vertical}label{font-size:14px;color:#c2d9d3}nav{display:flex;gap:9px;flex-wrap:wrap}.row{display:flex;gap:9px;align-items:center;justify-content:space-between}.row>*{min-width:0}.grow{flex:1}.pill{font-size:12px;border-radius:99px;padding:5px 9px;background:#31545b;color:#d4f3e8}.actions{display:flex;gap:9px;flex-wrap:wrap}.actions button{flex:1}.big{font-size:25px;font-weight:750}.masked{display:inline-block;background:#36545b;color:transparent;border-radius:4px;user-select:none;min-width:25px}.exercise{font-size:22px;line-height:1.8;white-space:pre-wrap}.bottom{position:fixed;bottom:0;left:0;right:0;background:#10262beF;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #42615e;z-index:3}.bottom>div{max-width:668px;margin:auto}.choice{display:block;padding:11px;border:1px solid #42615e;border-radius:10px;margin:8px 0}.choice input{width:auto;margin:0 8px 0 0}.hidden{display:none}.score{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.score>div{background:#10272d;border-radius:10px;padding:10px 3px}.score strong{display:block;font-size:23px}.spacer{height:80px}.error{color:#ffc1b7}
</style></head><body><header><h1>FabFab <span style="color:#70d6b5">Lyrics Trainer</span></h1><button class="secondary" id="home" onclick="goHome()">Bibliothèque</button></header><main id="app"></main><div id="bottom" class="bottom hidden"><div id="bottomInner"></div></div><script>
'use strict';const KEY='fabfab-lyrics-v1';let db=load(),current=null,session=null,translationOpen=new Set(),recognition=null;function load(){try{return JSON.parse(localStorage.getItem(KEY))||{songs:[]}}catch{return {songs:[]}}}function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Stockage indisponible ou saturé : '+e.message)}}function el(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function app(html){document.getElementById('app').innerHTML=html;document.getElementById('bottom').classList.add('hidden')}function foot(html){document.getElementById('bottom').classList.remove('hidden');document.getElementById('bottomInner').innerHTML=html}function song(){return db.songs.find(s=>s.id===current)}function parse(text){let sections=[],name='Paroles',lines=[];function flush(){if(lines.length)sections.push({name,lines:lines.map(t=>({text:t,translation:''}))});lines=[]}for(const raw of text.replace(/\r/g,'').split('\n')){let t=raw.trim();if(!t){flush();name='Section '+(sections.length+1);continue}if(/^\[(.+)\]$/.test(t)){flush();name=t.slice(1,-1);continue}lines.push(t)}flush();return sections}function allLines(s){return s.sections.flatMap((sec,si)=>sec.lines.map((l,li)=>({...l,si,li,section:sec.name,key:si+'-'+li})))}function goHome(){session=null;current=null;let songs=[...db.songs].sort((a,b)=>a.title.localeCompare(b.title,'fr'));app(`<h2>Mes chansons</h2><input id="search" placeholder="Rechercher un titre…" oninput="filterSongs()"><div class="actions"><button onclick="editSong()">+ Ajouter une chanson</button></div><div id="songs">${songs.map(s=>`<div class="card songitem" data-name="${el(s.title.toLowerCase())}"><div class="row"><div class="grow"><strong>${el(s.title)}</strong><div class="muted">Maîtrise ${s.mastery||0}/100 · Dernière séance ${s.lastScore??'—'}/100</div></div><button class="secondary" onclick="openSong('${s.id}')">Ouvrir</button></div></div>`).join('')||'<p class="muted">Aucune chanson. Ajoute les paroles de ton premier titre.</p>'}</div><p class="muted"><small>Les données sont enregistrées dans ce navigateur sur cet appareil. Effacer les données du navigateur peut les supprimer.</small></p>`)}function filterSongs(){let q=document.getElementById('search').value.toLowerCase();document.querySelectorAll('.songitem').forEach(x=>x.style.display=x.dataset.name.includes(q)?'':'none')}
function editSong(id){current=id||null;let s=song();let raw=s?s.sections.map(sec=>'['+sec.name+']\n'+sec.lines.map(l=>l.text).join('\n')).join('\n\n'):'';app(`<h2>${s?'Modifier':'Ajouter'} une chanson</h2><label>Titre<input id="title" value="${el(s?.title||'')}" placeholder="Titre de la chanson"></label><label>Paroles (colle ton texte ; utilise [Couplet 1], [Refrain]… pour nommer les sections)<textarea id="lyrics" style="min-height:260px">${el(raw)}</textarea></label><label>Niveau initial<select id="level"><option value="zero" ${s?.level==='zero'?'selected':''}>Je pars de zéro</option><option value="partial" ${s?.level==='partial'?'selected':''}>Je connais une partie</option><option value="almost" ${s?.level==='almost'?'selected':''}>Je connais presque tout</option></select></label><div class="actions"><button onclick="saveSong()">Enregistrer</button><button class="secondary" onclick="${s?'openSong(\''+s.id+'\')':'goHome()'}">Annuler</button></div>${s?'<p class="muted">Attention : modifier les paroles réinitialise les traductions et le suivi par phrase si le texte change.</p>':''}`)}function saveSong(){let title=document.getElementById('title').value.trim(),text=document.getElementById('lyrics').value.trim();if(!title||!text){alert('Renseigne le titre et les paroles.');return}let sections=parse(text);if(!sections.length){alert('Aucune phrase détectée.');return}let s=song(),level=document.getElementById('level').value;let original=s?.sections.map(x=>x.lines.map(l=>l.text).join('\n')).join('\n');let fresh=sections.map(x=>x.lines.map(l=>l.text).join('\n')).join('\n');if(s){if(original!==fresh){if(!confirm('Le texte a changé. Les traductions et progrès par phrase seront réinitialisés. Continuer ?'))return;s.progress={};s.sections=sections;s.mastery=0}else{s.sections.forEach((sec,i)=>{if(sections[i])sections[i].lines.forEach((l,j)=>l.translation=sec.lines[j]?.translation||'')});s.sections=sections}s.title=title;s.level=level}else{s={id:'s'+Date.now(),title,sections,level,progress:{},mastery:0,lastScore:null,best:0,lastDate:null};db.songs.push(s)}save();openSong(s.id)}
function openSong(id){current=id;session=null;translationOpen.clear();renderSong()}function renderSong(){let s=song();if(!s)return goHome();app(`<h2>${el(s.title)}</h2><div class="score"><div><strong>${s.mastery||0}</strong><small>Maîtrise /100</small></div><div><strong>${s.lastScore??'—'}</strong><small>Dernière /100</small></div><div><strong>${s.best||0}</strong><small>Record /100</small></div></div><p class="muted">${s.lastDate?'Dernière séance : '+el(s.lastDate):'Aucune séance réalisée'}</p><div class="actions"><button onclick="setupSession()">S'entraîner</button><button class="secondary" onclick="editSong('${s.id}')">Modifier</button><button class="secondary" onclick="editTranslations()">Traductions</button></div>${s.sections.map((sec,si)=>`<div class="section">${el(sec.name)}</div>${sec.lines.map((l,li)=>`<div class="line" onclick="toggleTranslation(${si},${li})">${el(l.text)}${translationOpen.has(si+'-'+li)&&l.translation?`<div class="translation">${el(l.translation)}</div>`:''}</div>`).join('')}`).join('')}<div class="spacer"></div><button class="ghost" onclick="deleteSong()">Supprimer cette chanson</button>`)}function toggleTranslation(si,li){let k=si+'-'+li;translationOpen.has(k)?translationOpen.delete(k):translationOpen.add(k);renderSong()}function editTranslations(){let s=song(),existing=s.sections.flatMap(sec=>sec.lines.map(l=>l.translation||'')).join('\n');app(`<h2>Traductions · ${el(s.title)}</h2><p class="muted">Colle toutes les traductions d'un coup, dans le même ordre que les paroles : une ligne traduite pour chaque ligne originale. Ne colle pas les titres de sections.</p><label>Traduction complète<textarea id="bulkTranslation" style="min-height:300px" placeholder="Colle ici toutes les lignes traduites…">${el(existing)}</textarea></label><p class="muted">${allLines(s).length} lignes originales à associer. Les lignes vides sont ignorées.</p><div id="translationCheck" class="muted"></div><div class="actions"><button onclick="saveTranslations()">Associer et enregistrer</button><button class="secondary" onclick="renderSong()">Annuler</button></div>`);document.getElementById('bulkTranslation').addEventListener('input',checkTranslations);checkTranslations()}
function translationLines(){return document.getElementById('bulkTranslation').value.replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean)}
function checkTranslations(){let expected=allLines(song()).length,actual=translationLines().length,box=document.getElementById('translationCheck');box.textContent=actual+' lignes traduites / '+expected+' lignes originales'+(actual===expected?' — correspondance prête.':' — vérifie le découpage avant de valider.');box.className=actual===expected?'muted':'error'}
function saveTranslations(){let lines=translationLines(),originals=allLines(song());if(lines.length!==originals.length){alert('Correspondance impossible : '+lines.length+' lignes traduites pour '+originals.length+' lignes originales. Corrige le découpage pour éviter un décalage.');return}originals.forEach((l,i)=>song().sections[l.si].lines[l.li].translation=lines[i]);save();translationOpen.clear();renderSong()}
function deleteSong(){if(confirm('Supprimer définitivement cette chanson et ses progrès ?')){db.songs=db.songs.filter(s=>s.id!==current);save();goHome()}}
function setupSession(){app(`<h2>Nouvelle séance</h2><div class="card"><h3>Durée</h3>${[5,10,15,20].map(n=>`<label class="choice"><input type="radio" name="duration" value="${n}" ${n===10?'checked':''}>${n} minutes</label>`).join('')}<h3>Réponse</h3><label class="choice"><input type="radio" name="mode" value="mental" checked> Mentalement</label><label class="choice"><input type="radio" name="mode" value="voice"> À voix haute (microphone si disponible)</label></div><button onclick="startSession()">Commencer</button>`)}function startSession(){let s=song(),lines=allLines(s);if(!lines.length)return;let duration=+document.querySelector('[name=duration]:checked').value,mode=document.querySelector('[name=mode]:checked').value;session={duration,mode,started:Date.now(),steps:[],index:0,phase:'question',final:false,voiceText:'',current:null};buildQueue();nextExercise()}function buildQueue(){let s=song(),lines=allLines(s),p=s.progress||{},weak=lines.filter(l=>(p[l.key]?.success||0)<2),review=lines.filter(l=>(p[l.key]?.attempts||0)>0),pool=weak.length?weak:lines;let count=Math.max(5,Math.round(session.duration*1.3));let q=[];if(review.length){q.push(...review.sort((a,b)=>(p[a.key]?.success||0)-(p[b.key]?.success||0)).slice(0,Math.min(3,review.length)))}for(let i=0;i<count;i++){let source=i%4===3?lines:pool;let candidate=source[(i*3+Math.floor(i/4))%source.length];q.push(candidate)}session.queue=q;session.total=count+q.length;session.cursor=0}
function nextExercise(){if(!session)return;let elapsed=(Date.now()-session.started)/60000;if(session.cursor>=session.queue.length||elapsed>=session.duration){finishSession();return}session.current=session.queue[session.cursor++];session.phase='question';session.voiceText='';session.hinted=false;renderExercise()}function renderExercise(){let s=song(),l=session.current,prog=s.progress[l.key]||{},difficulty=(prog.success||0);let show= difficulty===0?'gaps':difficulty===1?'start':'none';if(session.cursor%5===0)show='none';let txt=l.text,words=txt.split(/(\s+)/),display=show==='gaps'?words.map((w,i)=>i%4===0&&w.trim()?`<span class="masked">${el(w)}</span>`:el(w)).join(''):show==='start'?el(txt.split(' ').slice(0,2).join(' '))+' …':'À toi de retrouver la phrase';let previous=allLines(s).find(x=>x.si===l.si&&x.li===l.li-1);app(`<div class="row"><span class="pill">Exercice ${session.cursor}/${session.queue.length}</span><span class="muted">${session.duration} min · ${session.mode==='mental'?'Mental':'Vocal'}</span></div><h2>${el(s.title)}</h2><div class="section">${el(l.section)}</div><div class="card"><p class="muted">${previous?'Phrase précédente : '+el(previous.text):'Retrouve la phrase suivante'}</p><div class="exercise">${display}</div></div><p class="muted">${session.mode==='mental'?'Retrouve la phrase dans ta tête, puis touche « Afficher la réponse ».':'Récite à voix haute la phrase complète, puis vérifie ta réponse.'}</p>${session.mode==='voice'?`<button class="secondary" onclick="listen()">🎙️ Dicter ma réponse</button><p id="speech" class="muted">La reconnaissance dépend du navigateur et peut nécessiter Internet.</p>`:''}<button class="ghost" onclick="showHint()">Indice</button><div id="hint"></div>`);foot(`<div class="actions"><button onclick="reveal()">${session.mode==='mental'?'Afficher la réponse':'Voir la réponse'}</button></div><div style="text-align:center;margin-top:8px"><button class="ghost" style="padding:5px 14px;font-size:12px" onclick="finishSession()">Terminer la séance</button></div>`)}function showHint(){let l=session.current;session.hinted=true;document.getElementById('hint').innerHTML=`<div class="card"><strong>Indice :</strong> ${el(l.text.split(' ').slice(0,Math.max(1,Math.ceil(l.text.split(' ').length/3))).join(' '))}…</div>`}function listen(){let Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Speech){document.getElementById('speech').textContent='Reconnaissance non disponible. Tu pourras t’autoévaluer.';return}try{recognition?.abort();recognition=new Speech();recognition.lang=/[àâçéèêëîïôùûüÿœ]/i.test(session.current.text)?'fr-FR':'en-US';recognition.onresult=e=>{session.voiceText=Array.from(e.results).map(x=>x[0].transcript).join(' ');document.getElementById('speech').textContent='Reconnu : '+session.voiceText};recognition.onerror=e=>document.getElementById('speech').textContent='Microphone indisponible : '+e.error;recognition.start();document.getElementById('speech').textContent='Écoute en cours…'}catch(e){document.getElementById('speech').textContent=e.message}}function reveal(){try{recognition?.stop()}catch{}let l=session.current;session.phase='answer';app(`<span class="pill">Vérification</span><h2>${el(l.section)}</h2><div class="card"><div class="exercise">${el(l.text)}</div>${l.translation?`<button class="ghost" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden">Afficher la traduction</button><p hidden class="translation">${el(l.translation)}</p>`:''}</div>${session.voiceText?`<div class="card"><small>Transcription indicative</small><p>${el(session.voiceText)}</p></div>`:''}<h3>${session.mode==='mental'?'Évalue et passe à la phrase suivante':'Comment s’est passée ta réponse ?'}</h3><p class="muted">${session.mode==='mental'?'Un appui suffit : ton choix est enregistré et la phrase suivante apparaît immédiatement.':'Évalue toi-même, même si la reconnaissance vocale s’est trompée.'}</p>`);foot(`<div class="actions"><button onclick="rate(2)">Réussi</button><button class="secondary" onclick="rate(1)">Difficile</button><button class="secondary" onclick="rate(0)">Raté</button></div>`)}function rate(n){let l=session.current,s=song(),p=s.progress[l.key]||{attempts:0,success:0};p.attempts++;p.success=n===2?p.success+1:0;p.last=n;p.lastAt=Date.now();s.progress[l.key]=p;session.steps.push({key:l.key,rating:n,hint:!!session.hinted});session.hinted=false;if(n<2&&session.cursor<session.queue.length-2){session.queue.splice(Math.min(session.cursor+3,session.queue.length),0,l)}save();nextExercise()}function finishSession(){if(!session)return;let s=song(),steps=session.steps,score=steps.length?Math.round(steps.reduce((a,b)=>a+(b.rating===2?100:b.rating===1?55:0)-(b.hint?10:0),0)/steps.length):0;let lines=allLines(s),total=lines.reduce((sum,l)=>sum+Math.min(100,(s.progress[l.key]?.success||0)*50),0);s.mastery=Math.round(total/lines.length);if(steps.length){s.lastScore=Math.max(0,score);s.best=Math.max(s.best||0,s.lastScore);s.lastDate=new Date().toLocaleDateString('fr-FR')}save();session=null;app(`<h2>Séance terminée</h2><div class="score"><div><strong>${steps.length?Math.max(0,score):'—'}</strong><small>Séance /100</small></div><div><strong>${s.mastery}</strong><small>Maîtrise /100</small></div><div><strong>${s.best}</strong><small>Record /100</small></div></div><div class="card"><p>${steps.length} réponse(s) évaluée(s).</p><p class="muted">La maîtrise est une estimation basée sur les répétitions réussies pour l'ensemble des phrases. Les scores sont indicatifs.</p></div><button onclick="renderSong()">Retour aux paroles</button>`)}window.addEventListener('beforeunload',()=>{try{recognition?.stop()}catch{}});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));goHome();
</script></body></html>
